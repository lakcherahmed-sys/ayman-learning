<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ayman apprend ! 🚛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --orange:#FF6B35;--orange2:#FF8C5A;--yellow:#FFD93D;--green:#6BCB77;
  --blue:#4D96FF;--purple:#C77DFF;--pink:#FF6B9D;--red:#FF4757;
  --bg:#FFF8F0;--white:#FFFFFF;--gray:#F0EBE3;--text:#2C2416;--muted:#9B8F82;
  --radius:20px;--shadow:0 4px 20px rgba(0,0,0,0.10);
}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;flex-direction:column;height:100vh;max-width:900px;margin:0 auto;background:var(--white);box-shadow:var(--shadow);}
.topbar{background:var(--orange);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.avatar{width:46px;height:46px;border-radius:50%;background:#fff3;border:2px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;font-size:24px;}
.topbar-name{font-size:22px;font-weight:900;color:#fff;line-height:1;}
.topbar-age{font-size:12px;color:#FFD4C0;font-weight:500;margin-top:2px;}
.stars-badge{background:var(--yellow);color:#7A5000;border-radius:20px;padding:7px 16px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:5px;}
.month-bar{display:flex;gap:0;background:var(--gray);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;border-bottom:2px solid #E8E0D5;}
.month-tab{flex:1;min-width:78px;border:none;background:transparent;padding:10px 4px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.2s;border-bottom:3px solid transparent;white-space:nowrap;}
.month-tab .m-emoji{font-size:20px;display:block;margin-bottom:2px;}
.month-tab.active{background:var(--white);color:var(--orange);border-bottom:3px solid var(--orange);}
.nav{display:flex;background:var(--white);border-top:1.5px solid #EDE8E0;flex-shrink:0;}
.nav-btn{flex:1;border:none;background:transparent;padding:10px 4px 9px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all 0.2s;}
.nav-btn .ni{font-size:24px;transition:transform 0.2s;}
.nav-btn.active{color:var(--orange);}
.nav-btn.active .ni{transform:scale(1.2);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.content{padding:16px 14px 24px;}
.section-title{font-size:22px;font-weight:900;color:var(--text);margin:22px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.section-pill{font-size:12px;font-weight:800;background:var(--gray);color:var(--muted);border-radius:20px;padding:4px 12px;margin-left:auto;}

/* BIG CARDS for kids */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.card{background:var(--white);border:3px solid #EDE8E0;border-radius:22px;padding:18px 12px 14px;cursor:pointer;transition:transform 0.12s,border-color 0.2s,background 0.2s;text-align:center;user-select:none;box-shadow:0 3px 10px rgba(0,0,0,0.07);}
.card:active{transform:scale(0.90);}
.card.done{background:linear-gradient(135deg,#EAFBEC,#D2F5D6);border-color:var(--green);box-shadow:0 3px 14px rgba(107,203,119,0.3);}
.card .c-icon{font-size:58px;line-height:1;margin-bottom:10px;display:block;}
.card .c-label{font-size:17px;font-weight:900;color:var(--text);line-height:1.3;}
.card .c-sub{font-size:13px;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.4;}
.card .c-done{font-size:15px;color:var(--green);margin-top:8px;font-weight:900;}
.card .c-tap{font-size:12px;color:#C0B8B0;margin-top:5px;font-weight:500;}

/* ALPHABET */
.alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;}
.alpha-card{background:var(--white);border:2.5px solid #EDE8E0;border-radius:16px;padding:12px 6px;cursor:pointer;transition:transform 0.12s,background 0.2s;text-align:center;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
.alpha-card:active{transform:scale(0.87);}
.alpha-card.done{background:linear-gradient(135deg,#EAFBEC,#D2F5D6);border-color:var(--green);}
.alpha-card .al{font-size:34px;font-weight:900;color:var(--orange);font-family:'Georgia',serif;display:block;line-height:1;}
.alpha-card .aw{font-size:10px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.3;}
.alpha-card .ac{font-size:16px;color:var(--green);margin-top:3px;}

/* NUMBERS */
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.num-card{border-radius:20px;padding:16px 8px;cursor:pointer;transition:transform 0.12s;text-align:center;user-select:none;border:3px solid transparent;box-shadow:0 3px 8px rgba(0,0,0,0.07);}
.num-card:active{transform:scale(0.87);}
.num-card.done{opacity:0.65;}
.num-card .nn{font-size:42px;font-weight:900;line-height:1;display:block;}
.num-card .nw{font-size:12px;font-weight:800;margin-top:5px;line-height:1.5;}

/* QUIZ */
.quiz-wrap{background:var(--white);border-radius:24px;border:2.5px solid #EDE8E0;padding:22px 18px;box-shadow:var(--shadow);}
.quiz-icon-big{font-size:90px;text-align:center;display:block;margin-bottom:6px;animation:pop 0.35s ease;}
@keyframes pop{0%{transform:scale(0.6);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
.quiz-q{font-size:22px;font-weight:900;color:var(--text);text-align:center;margin-bottom:20px;line-height:1.4;}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.opt{background:var(--gray);border:3px solid #EDE8E0;border-radius:18px;padding:16px 10px;font-size:18px;font-weight:900;cursor:pointer;transition:all 0.15s;color:var(--text);text-align:center;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
.opt:active{transform:scale(0.92);}
.opt.correct{background:#D2F5D6;border-color:var(--green);color:#1A6B2A;}
.opt.wrong{background:#FFE0E0;border-color:var(--red);color:#8B1A1A;}
.fb{text-align:center;font-size:24px;font-weight:900;min-height:38px;margin-bottom:8px;}
.fb.ok{color:var(--green);}
.fb.ko{color:var(--red);}
.next-btn{display:block;width:100%;background:var(--orange);color:#fff;border:none;border-radius:18px;padding:18px;font-size:20px;font-weight:900;cursor:pointer;margin-top:10px;letter-spacing:0.01em;box-shadow:0 4px 14px rgba(255,107,53,0.35);}
.next-btn:active{background:var(--orange2);transform:scale(0.97);}

/* PROG BARS */
.prog-wrap{height:10px;background:var(--gray);border-radius:10px;overflow:hidden;margin:10px 0 18px;}
.prog-bar{height:100%;background:var(--orange);border-radius:10px;transition:width 0.5s;}
.score-row{display:flex;gap:10px;margin-bottom:14px;}
.sc{flex:1;border-radius:16px;padding:12px 6px;text-align:center;}
.sc-val{font-size:28px;font-weight:900;}
.sc-lbl{font-size:11px;font-weight:700;margin-top:2px;}

/* TIMELINE */
.tl{display:flex;flex-direction:column;}
.tl-row{display:flex;}
.tl-spine{display:flex;flex-direction:column;align-items:center;width:54px;flex-shrink:0;}
.tl-circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:3px solid #EDE8E0;background:var(--white);}
.tl-circle.active{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px rgba(255,107,53,0.18);}
.tl-circle.done{background:var(--green);border-color:var(--green);}
.tl-line{flex:1;width:3px;background:#EDE8E0;min-height:20px;}
.tl-body{flex:1;padding:4px 0 24px 14px;}
.tl-date{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
.tl-date.now{color:var(--orange);}
.tl-title{font-size:17px;font-weight:900;color:var(--text);margin-top:3px;}
.tl-desc{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;}
.tl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.ttag{font-size:12px;border-radius:12px;padding:4px 12px;font-weight:700;}

/* STARS PAGE */
.big-star{text-align:center;padding:22px 0 16px;}
.medal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.medal-card{border-radius:18px;padding:16px;text-align:center;}
.sticker-zone{background:var(--white);border-radius:22px;border:2.5px solid #EDE8E0;padding:18px;margin-bottom:14px;}
.stickers{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
.sticker{font-size:42px;cursor:pointer;transition:transform 0.15s;display:inline-block;}
.sticker:active{transform:scale(1.5) rotate(15deg);}
.log-box{background:var(--white);border-radius:22px;border:2.5px solid #EDE8E0;padding:16px;}
.log-entry{font-size:13px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--gray);line-height:1.5;}
.log-entry:last-child{border-bottom:none;}

/* POPUP */
.popup{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.popup.show{opacity:1;pointer-events:all;}
.popup-box{background:var(--white);border-radius:30px;padding:34px 26px;text-align:center;max-width:310px;width:90%;transform:scale(0.75);transition:transform 0.25s;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.popup.show .popup-box{transform:scale(1);}
.popup-icon{font-size:76px;display:block;margin-bottom:8px;}
.popup-title{font-size:28px;font-weight:900;color:var(--text);margin-bottom:6px;}
.popup-sub{font-size:15px;color:var(--muted);margin-bottom:22px;line-height:1.5;}
.popup-btn{background:var(--orange);color:#fff;border:none;border-radius:16px;padding:16px 30px;font-size:18px;font-weight:900;cursor:pointer;width:100%;box-shadow:0 4px 14px rgba(255,107,53,0.35);}

.reset-btn{display:block;width:100%;background:#FFF0EE;color:var(--red);border:2.5px solid #FFCCC5;border-radius:18px;padding:16px;font-size:16px;font-weight:900;cursor:pointer;margin-top:14px;text-align:center;}
.reset-btn:active{background:#FFE0DC;transform:scale(0.97);}

.hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">

        <div class="topbar-name">Ayman</div>

</div>

   sections:[
     {type:'cards',head:'🎒 Routine crèche',sub:'Français + English',id:'creche',items:[
       {icon:'🌅',en:'Bonjour ! Good morning',ar:'صباح الخير'},{icon:'🌙',en:'Au revoir ! Goodbye',ar:'وداعا'},
       {icon:'🪪',en:'Je m\'appelle Ayman',ar:'اسمي أيمن'},{icon:'🆘',en:'J\'ai besoin d\'aide',ar:'أحتاج مساعدة'},
       {icon:'🚽',en:'J\'ai envie de pipi',ar:'أريد الحمام'},{icon:'🍎',en:'J\'ai faim / I\'m hungry',ar:'أنا جائع'},
       {icon:'👫',en:'C\'est mon ami(e)',ar:'هذا صديقي'},{icon:'🎈',en:'Je veux jouer',ar:'أريد أن ألعب'},
       {icon:'😢',en:'Je veux maman / papa',ar:'أريد ماما'},{icon:'🤲',en:'Pardon / Sorry',ar:'أعتذر'},
     ].map(x=>({...x,done:false}))},
     {type:'cards',head:'✅ Révision finale',sub:'Tout ce qu\'Ayman sait !',id:'rev',items:[
       {icon:'🌈',en:'8 couleurs ✓',ar:'All colors'},{icon:'🔢',en:'1 → 20 ✓',ar:'All numbers'},
       {icon:'🔤',en:'A → Z ✓',ar:'Alphabet'},{icon:'🐘',en:'12 animaux ✓',ar:'Animals'},
       {icon:'🚛',en:'10 véhicules ✓',ar:'Vehicles'},{icon:'🧍',en:'Corps humain ✓',ar:'Body'},
     ].map(x=>({...x,done:false}))},
   ]},
];

// ── STATE ──
let stars=0,qIdx=0,qScore=0,qTotal=0,qStreak=0,answered=false,curMonth='may26',activeTab='learn';
let doneMap={},numDone={},alphaDone={},sessLog=[];

function save(){try{localStorage.setItem('ay26d',JSON.stringify(doneMap));localStorage.setItem('ay26n',JSON.stringify(numDone));localStorage.setItem('ay26a',JSON.stringify(alphaDone));localStorage.setItem('ay26s',stars);localStorage.setItem('ay26qs',qScore);localStorage.setItem('ay26qt',qTotal);localStorage.setItem('ay26qst',qStreak);localStorage.setItem('ay26log',JSON.stringify(sessLog));}catch(e){}}
function load(){try{doneMap=JSON.parse(localStorage.getItem('ay26d')||'{}');numDone=JSON.parse(localStorage.getItem('ay26n')||'{}');alphaDone=JSON.parse(localStorage.getItem('ay26a')||'{}');stars=parseInt(localStorage.getItem('ay26s')||'0');qScore=parseInt(localStorage.getItem('ay26qs')||'0');qTotal=parseInt(localStorage.getItem('ay26qt')||'0');qStreak=parseInt(localStorage.getItem('ay26qst')||'0');sessLog=JSON.parse(localStorage.getItem('ay26log')||'[]');}catch(e){}}

function mStats(m){let d=0,t=0;m.sections.forEach(s=>{if(s.type==='cards'){t+=s.items.length;s.items.forEach((_,i)=>{if(doneMap[m.id+'_'+s.id+'_'+i])d++;});}else if(s.type==='numbers'){const c=s.end-s.start+1;t+=c;for(let n=s.start;n<=s.end;n++){if(numDone[n])d++;}}else if(s.type==='alpha'){t+=26;'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{if(alphaDone[l])d++;});}});return{d,t};}
function totalAll(){let d=0,t=0;MD.forEach(m=>{const s=mStats(m);d+=s.d;t+=s.t;});return{d,t};}

function updStars(){document.getElementById('stars-top').textContent=stars;const s=document.getElementById('sc-stars');if(s)s.textContent=stars;[{id:'bronze',v:10},{id:'silver',v:25},{id:'gold',v:50},{id:'trophy',v:100}].forEach(m=>{const el=document.getElementById('medal-'+m.id);if(el)el.textContent=Math.min(stars,m.v)+'/'+m.v;});}

let popT;
function showPopup(i,t,s){document.getElementById('pi').textContent=i;document.getElementById('pt').textContent=t;document.getElementById('ps').textContent=s;document.getElementById('popup').classList.add('show');clearTimeout(popT);popT=setTimeout(closePopup,1600);}
function closePopup(){document.getElementById('popup').classList.remove('show');}

function logSess(label){const n=new Date();const t=n.toLocaleDateString('fr-FR')+' '+n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});sessLog.unshift(t+' — ✅ '+label);if(sessLog.length>20)sessLog.pop();const el=document.getElementById('log-list');if(el)el.innerHTML=sessLog.length?sessLog.map(l=>'<div class="log-entry">'+l+'</div>').join(''):'<div class="log-entry">Aucune session.</div>';}

// ── MONTH TABS ──
function renderMBar(){const bar=document.getElementById('month-bar');bar.innerHTML='';MD.forEach(m=>{const{d,t}=mStats(m);const full=d===t&&t>0;const b=document.createElement('button');b.className='month-tab'+(m.id===curMonth?' active':'');b.innerHTML='<span class="m-emoji">'+(full?'✅':m.emoji)+'</span>'+m.label;b.onclick=()=>{curMonth=m.id;renderMBar();renderLearn();};bar.appendChild(b);});}

// ── LEARN ──
function renderLearn(){
  const c=document.getElementById('main-content');c.innerHTML='';
  const m=MD.find(x=>x.id===curMonth);
  const{d,t}=mStats(m);const pct=t?Math.round(d/t*100):0;
  c.innerHTML+=`<div class="score-row"><div class="sc" style="background:#EEEDFE"><div class="sc-val" style="color:#3C3489">${d}</div><div class="sc-lbl" style="color:#534AB7">acquis</div></div><div class="sc" style="background:#FAECE7"><div class="sc-val" style="color:#712B13">${t}</div><div class="sc-lbl" style="color:#993C1D">objectifs</div></div><div class="sc" style="background:#E1F5EE"><div class="sc-val" style="color:#085041">${pct}%</div><div class="sc-lbl" style="color:#0F6E56">ce mois</div></div></div><div class="prog-wrap"><div class="prog-bar" style="width:${Math.max(2,pct)}%"></div></div>`;

  m.sections.forEach(sec=>{
    if(sec.type==='cards'){
      const sd=sec.items.filter((_,i)=>doneMap[m.id+'_'+sec.id+'_'+i]).length;
      const h=document.createElement('div');h.className='section-title';h.innerHTML=sec.head+(sec.sub?'<span style="font-size:13px;color:var(--muted);font-weight:600"> — '+sec.sub+'</span>':'')+`<span class="section-pill">${sd}/${sec.items.length}</span>`;c.appendChild(h);
      const g=document.createElement('div');g.className='cards-grid';
      sec.items.forEach((item,i)=>{
        const key=m.id+'_'+sec.id+'_'+i,isDone=!!doneMap[key];
        const card=document.createElement('div');card.className='card'+(isDone?' done':'');
        const sub=item.ar+(item.es?' / '+item.es:'');
        card.innerHTML=`<span class="c-icon">${item.icon}</span><div class="c-label">${item.en}</div><div class="c-sub">${sub}</div>${isDone?'<div class="c-done">✓ Bravo !</div>':'<div class="c-tap">👆 Appuie ici !</div>'}`;
        card.onclick=()=>{const was=!!doneMap[key];doneMap[key]=!was;if(!was){stars++;logSess(item.en);showPopup('⭐','Bravo Ayman !',item.icon+' '+item.en);}else if(stars>0)stars--;updStars();renderMBar();renderLearn();save();};
        g.appendChild(card);
      });c.appendChild(g);
    }
    else if(sec.type==='numbers'){
      const cnt=sec.end-sec.start+1,nd=[...Array(cnt)].filter((_,i)=>numDone[sec.start+i]).length;
      const h=document.createElement('div');h.className='section-title';h.innerHTML=sec.head+`<span class="section-pill">${nd}/${cnt}</span>`;c.appendChild(h);
      const g=document.createElement('div');g.className='num-grid';
      for(let n=sec.start;n<=sec.end;n++){
        const isDone=!!numDone[n],col=NC[(n-1)%NC.length];
        const card=document.createElement('div');card.className='num-card'+(isDone?' done':'');
        card.style.background=col+'1E';card.style.borderColor=isDone?'var(--green)':col;
        card.innerHTML=`<span class="nn" style="color:${col}">${n}</span><div class="nw" style="color:${col}">${NEN[n]}<br>${NAR[n]}</div>${isDone?'<div style="font-size:18px;color:var(--green);font-weight:900;margin-top:4px">✓</div>':''}`;
        card.onclick=()=>{const was=!!numDone[n];numDone[n]=!was;if(!was){stars++;logSess(n+' '+NEN[n]);showPopup('🔢',n+' — '+NEN[n],''+NAR[n]);}else if(stars>0)stars--;updStars();renderMBar();renderLearn();save();};
        g.appendChild(card);
      }c.appendChild(g);
    }
    else if(sec.type==='alpha'){
      const ad='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(l=>alphaDone[l]).length;
      const h=document.createElement('div');h.className='section-title';h.innerHTML=sec.head+`<span class="section-pill">${ad}/26</span>`;c.appendChild(h);
      const g=document.createElement('div');g.className='alpha-grid';
      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
        const isDone=!!alphaDone[l];
        const card=document.createElement('div');card.className='alpha-card'+(isDone?' done':'');
        card.innerHTML=`<span class="al">${l}</span><div class="aw">${AW[l]||l}</div>${isDone?'<div class="ac">✓</div>':''}`;
        card.onclick=()=>{const was=!!alphaDone[l];alphaDone[l]=!was;if(!was){stars++;logSess('Letter '+l);showPopup('🔤','Lettre '+l+' !',AW[l]||'');}else if(stars>0)stars--;updStars();renderMBar();renderLearn();save();};
        g.appendChild(card);
      });c.appendChild(g);
    }
  });
  document.getElementById('scroll').scrollTop=0;
}

// ── QUIZ ──
const QUIZ=[
  {icon:'🐘',q:'What animal is this?',opts:['Elephant','Lion','Cow','Giraffe'],ans:'Elephant'},
  {icon:'🚛',q:'What vehicle is this?',opts:['Bus','Train','Truck','Car'],ans:'Truck'},
  {icon:'🔴',q:'What color is this? 🔴',opts:['Blue','Red','Green','Yellow'],ans:'Red'},
  {icon:'🦁',q:'ROAR! This animal is a...',opts:['Elephant','Giraffe','Lion','Frog'],ans:'Lion'},
  {icon:'🚒',q:'Red truck that fights fires!',opts:['Ambulance','Tractor','Fire truck','Bus'],ans:'Fire truck'},
  {icon:'🟡',q:'Color of the sun? ☀️',opts:['Red','Blue','Yellow','Green'],ans:'Yellow'},
  {icon:'🐸',q:'Green animal that jumps!',opts:['Fish','Cow','Giraffe','Frog'],ans:'Frog'},
  {icon:'🚜',q:'Farmers use this on fields.',opts:['Fire truck','Tractor','Ambulance','Train'],ans:'Tractor'},
  {icon:'🦒',q:'Very very long neck!',opts:['Elephant','Giraffe','Lion','Cow'],ans:'Giraffe'},
  {icon:'🔵',q:'Color of the sea? 🌊',opts:['Red','Yellow','Green','Blue'],ans:'Blue'},
  {icon:'🚑',q:'White truck for sick people!',opts:['Bus','Fire truck','Ambulance','Tractor'],ans:'Ambulance'},
  {icon:'🟢',q:'Color of grass? 🌿',opts:['Red','Yellow','Green','Blue'],ans:'Green'},
  {icon:'🐯',q:'Orange animal with stripes!',opts:['Lion','Zebra','Tiger','Cow'],ans:'Tiger'},
  {icon:'🦓',q:'Black & white stripes!',opts:['Tiger','Zebra','Horse','Giraffe'],ans:'Zebra'},
  {icon:'🚌',q:'Big vehicle for many people!',opts:['Truck','Bus','Train','Tractor'],ans:'Bus'},
  {icon:'3️⃣',q:'What number is this? 3️⃣',opts:['Two','Four','Three','Five'],ans:'Three'},
  {icon:'7️⃣',q:'What number is this? 7️⃣',opts:['Six','Eight','Nine','Seven'],ans:'Seven'},
  {icon:'⭕',q:'Round shape — it\'s a...',opts:['Triangle','Square','Circle','Star'],ans:'Circle'},
  {icon:'🐻',q:'Fluffy brown animal!',opts:['Lion','Monkey','Bear','Tiger'],ans:'Bear'},
  {icon:'✈️',q:'This vehicle flies in the sky!',opts:['Helicopter','Airplane','Rocket','Bus'],ans:'Airplane'},
  {icon:'😊',q:'This face is...',opts:['Sad','Angry','Scared','Happy'],ans:'Happy'},
  {icon:'😢',q:'This face is...',opts:['Happy','Angry','Sad','Sleepy'],ans:'Sad'},
  {icon:'🐒',q:'This animal swings in trees!',opts:['Bear','Monkey','Tiger','Frog'],ans:'Monkey'},
];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let qList=[...QUIZ];shuf(qList);

function renderQuiz(){
  answered=false;
  const q=qList[qIdx%qList.length];
  const c=document.getElementById('main-content');c.innerHTML='';
  c.innerHTML=`<div class="score-row"><div class="sc" style="background:#EAF3DE"><div class="sc-val" style="color:#27500A" id="qs">${qScore}</div><div class="sc-lbl" style="color:#3B6D11">✓ correctes</div></div><div class="sc" style="background:#FAEEDA"><div class="sc-val" style="color:#633806" id="qt">${qTotal}</div><div class="sc-lbl" style="color:#854F0B">jouées</div></div><div class="sc" style="background:#EEEDFE"><div class="sc-val" style="color:#3C3489" id="qst">${qStreak}</div><div class="sc-lbl" style="color:#534AB7">🔥 série</div></div></div>`;
  const wrap=document.createElement('div');wrap.className='quiz-wrap';
  wrap.innerHTML=`<span class="quiz-icon-big">${q.icon}</span><div class="quiz-q">${q.q}</div>`;
  const optsEl=document.createElement('div');optsEl.className='quiz-opts';
  const fbEl=document.createElement('div');fbEl.className='fb';
  const shuffOpts=[...q.opts];shuf(shuffOpts);
  shuffOpts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{if(answered)return;answered=true;qTotal++;optsEl.querySelectorAll('.opt').forEach(btn=>{if(btn.textContent===q.ans)btn.className='opt correct';else if(btn.textContent===o&&o!==q.ans)btn.className='opt wrong';});if(o===q.ans){qScore++;stars++;qStreak++;fbEl.textContent='🎉 Correct ! Bravo !';fbEl.className='fb ok';showPopup('🌟','Super Ayman !','Tu as trouvé : '+q.ans+' !');}else{qStreak=0;fbEl.textContent='💪 Bonne réponse : '+q.ans;fbEl.className='fb ko';}updStars();save();document.getElementById('qs').textContent=qScore;document.getElementById('qt').textContent=qTotal;document.getElementById('qst').textContent=qStreak;};optsEl.appendChild(b);});
  const nb=document.createElement('button');nb.className='next-btn';nb.textContent='Question suivante ➜';nb.onclick=()=>{qIdx=(qIdx+1)%qList.length;if(qIdx===0){qList=[...QUIZ];shuf(qList);}renderQuiz();};
  wrap.appendChild(optsEl);wrap.appendChild(fbEl);wrap.appendChild(nb);c.appendChild(wrap);
  document.getElementById('scroll').scrollTop=0;
}

// ── PLAN ──
function renderPlan(){
  const c=document.getElementById('main-content');c.innerHTML='<div class="section-title">📅 Programme Mai → Sept 2026</div>';
  const tl=document.createElement('div');tl.className='tl';
  MD.forEach((m,idx)=>{
    const isLast=idx===MD.length-1;const{d,t}=mStats(m);const pct=t?Math.round(d/t*100):0;const full=pct===100;
    const row=document.createElement('div');row.className='tl-row';
    row.innerHTML=`<div class="tl-spine"><div class="tl-circle ${full?'done':m.status}">${full?'✅':m.emoji}</div>${!isLast?'<div class="tl-line"></div>':''}</div><div class="tl-body"><div class="tl-date ${m.status==='active'?'now':''}">${m.label} ${m.year}${m.status==='active'?' — EN COURS ✨':''}</div><div class="tl-title">${m.tlTitle}</div><div class="tl-desc">${m.tlDesc}</div><div class="tl-tags">${m.tlTags.map(tg=>`<span class="ttag" style="background:${tg.c};color:${tg.t}">${tg.l}</span>`).join('')}</div>${t>0?`<div class="prog-wrap" style="margin-top:10px"><div class="prog-bar" style="width:${Math.max(2,pct)}%;${full?'background:var(--green)':''}"></div></div><div style="font-size:12px;color:var(--muted);font-weight:700;margin-top:3px">${d}/${t} acquis (${pct}%)</div>`:''}</div>`;
    tl.appendChild(row);
  });
  c.appendChild(tl);
  c.innerHTML+=`<div class="log-box" style="margin-top:18px;background:#E6F1FB;border-color:#B3D4F5"><div style="font-size:15px;font-weight:900;color:#0C447C;margin-bottom:8px">💡 Sources : CDC, UNICEF, HealthyChildren.org</div><div style="font-size:13px;color:#185FA5;line-height:1.7">À 25-30 mois, l'enfant apprend par <strong>imitation</strong> et <strong>jeu</strong>. Nommez les objets, lisez des livres illustrés, chantez l'alphabet, comptez ensemble dans le quotidien. Les camions d'Ayman sont parfaits : "The big RED truck!" combine couleur, taille et vocabulaire en une seule phrase fun !</div></div>`;
  document.getElementById('scroll').scrollTop=0;
}

// ── STARS ──
function renderStars(){
  const c=document.getElementById('main-content');const{d,t}=totalAll();const gp=t?Math.round(d/t*100):0;
  c.innerHTML=`<div class="big-star"><div style="font-size:60px">⭐</div><div style="font-size:56px;font-weight:900;color:var(--text)" id="sc-stars">${stars}</div><div style="font-size:15px;color:var(--muted);margin-top:6px;font-weight:700">étoiles gagnées</div><div style="margin-top:12px;font-size:14px;color:var(--orange);font-weight:800">${d}/${t} objectifs atteints (${gp}%)</div><div class="prog-wrap" style="width:75%;margin:10px auto 0"><div class="prog-bar" style="width:${Math.max(2,gp)}%"></div></div></div>`;
  const mg=document.createElement('div');mg.className='medal-grid';
  [{id:'bronze',icon:'🥉',name:'Bronze',v:10,c:'#FAEEDA',tc:'#633806'},{id:'silver',icon:'🥈',name:'Argent',v:25,c:'#F1EFE8',tc:'#444441'},{id:'gold',icon:'🥇',name:'Or',v:50,c:'#FAEEDA',tc:'#633806'},{id:'trophy',icon:'🏆',name:'Champion',v:100,c:'#EEEDFE',tc:'#3C3489'}].forEach(m=>{const r=stars>=m.v;mg.innerHTML+=`<div class="medal-card" style="background:${m.c}"><div style="font-size:36px">${r?m.icon:'🔒'}</div><div style="font-size:14px;font-weight:900;color:${m.tc};margin-top:6px">${m.name} — ${m.v}⭐</div><div style="font-size:12px;font-weight:700;color:${m.tc};margin-top:4px" id="medal-${m.id}">${Math.min(stars,m.v)}/${m.v}</div></div>`;});
  c.appendChild(mg);
  const sz=document.createElement('div');sz.className='sticker-zone';sz.innerHTML='<div style="font-size:16px;font-weight:900;color:var(--text)">🎨 Stickers d\'Ayman</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Appuie sur un sticker !</div>';
  const sr=document.createElement('div');sr.className='stickers';
  ['🐘','🚛','🦁','🚜','🦒','🚒','🐸','🚑','🐯','🚌','🦓','🚂','🐬','🐒','✈️','🚁','🌈','⭐','🏆','🎉'].forEach(s=>{const el=document.createElement('span');el.className='sticker';el.textContent=s;el.onclick=()=>showPopup(s,'Ayman a choisi !',s+' '+s+' '+s);sr.appendChild(el);});
  sz.appendChild(sr);c.appendChild(sz);
  const lb=document.createElement('div');lb.className='log-box';lb.innerHTML='<div style="font-size:15px;font-weight:900;color:var(--text);margin-bottom:10px">📋 Journal des parents</div><div id="log-list"></div>';c.appendChild(lb);
  const ll=document.getElementById('log-list');if(ll)ll.innerHTML=sessLog.length?sessLog.map(l=>'<div class="log-entry">'+l+'</div>').join(''):'<div class="log-entry">Aucune session enregistrée.</div>';
  const rb=document.createElement('button');rb.className='reset-btn';rb.innerHTML='🔄 Recommencer depuis le début';rb.onclick=resetProgress;c.appendChild(rb);
  document.getElementById('scroll').scrollTop=0;
}

// ── RESET ──
function resetProgress(){
  if(!confirm('🔄 Remettre la progression à zéro ?\n\nLes cartes et étoiles seront réinitialisées.\nLe journal des sessions sera conservé.'))return;
  const n=new Date();const t=n.toLocaleDateString('fr-FR')+' '+n.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  sessLog.unshift(t+' — 🔄 Remise à zéro par les parents');
  doneMap={};numDone={};alphaDone={};stars=0;qScore=0;qTotal=0;qStreak=0;
  save();updStars();renderMBar();renderStars();
  showPopup('🔄','Remise à zéro !','La progression d\'Ayman repart de zéro 💪');
}

// ── TABS ──
function showTab(name){
  activeTab=name;
  document.getElementById('month-bar').style.display=name==='learn'?'flex':'none';
  ['learn','quiz','plan','stars'].forEach(t=>document.getElementById('nav-'+t).className='nav-btn'+(t===name?' active':''));
  if(name==='learn')renderLearn();
  else if(name==='quiz')renderQuiz();
  else if(name==='plan')renderPlan();
  else renderStars();
}

// ── INIT ──
load();renderMBar();renderLearn();updStars();
</script>
</body>
</html>
